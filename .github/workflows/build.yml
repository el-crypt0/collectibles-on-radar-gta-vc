
name: Build Collectibles on Radar VC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout mod
        uses: actions/checkout@v4

      - name: Checkout Plugin-SDK
        uses: actions/checkout@v4
        with:
          repository: DK22Pac/plugin-sdk
          path: plugin-sdk
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate Plugin-SDK projects
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\plugin-sdk
          cd plugin-sdk
          call "tools\generate\Visual Studio.bat"

      - name: Build Vice City SDK
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\plugin-sdk
          cd plugin-sdk
          msbuild plugin.slnx /property:Configuration=zDebug /property:Platform="Mixed Platforms" /target:plugin_vc /m /verbosity:minimal

      - name: Build Collectibles ASI
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\plugin-sdk
          msbuild CollectiblesOnRadarVC.vcxproj /property:Configuration=Release /property:Platform=Win32 /property:PlatformToolset=v145 /property:PostBuildEventUseInBuild=false /m /verbosity:minimal

      - name: Upload ASI file
        uses: actions/upload-artifact@v4
        with:
          name: CollectiblesOnRadar-VC
          path: output/asi/CollectiblesOnRadar.VC.asi
          if-no-files-found: error
